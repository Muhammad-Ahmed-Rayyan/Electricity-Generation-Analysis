name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src tests main.py --max-line-length=110 --ignore=E203,W503

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Smoke-test full pipeline (small sample, no tuning)
        run: |
          python main.py --sample 2000